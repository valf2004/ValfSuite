services:
  valfsuite-next:
    build:
      context: .
    container_name: valfsuite_next
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:3000"
    environment:
      AVAILABILITY_WEBHOOK_URL: ${AVAILABILITY_WEBHOOK_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://valfsuite.valfservice.it/api/auth/google/callback}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTHORIZED_ADMIN_EMAILS: ${AUTHORIZED_ADMIN_EMAILS:-valfsuite@gmail.com,viliorlandi@gmail.com,angrimaldi79@gmail.com,valf2004@gmail.com}
