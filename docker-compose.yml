services:
  postgres:
    image: postgres:17-alpine
    container_name: valfsuite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: valfsuite
      POSTGRES_USER: valfsuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valfsuite -d valfsuite"]
      interval: 10s
      timeout: 5s
      retries: 5

  valfsuite-next:
    build:
      context: .
    container_name: valfsuite_next
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8095:3000"
    environment:
      AVAILABILITY_WEBHOOK_URL: ${AVAILABILITY_WEBHOOK_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://valfsuite.valfservice.it/api/auth/google/callback}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTHORIZED_ADMIN_EMAILS: ${AUTHORIZED_ADMIN_EMAILS:-valfsuite@gmail.com,viliorlandi@gmail.com,angrimaldi@gmail.com,valf2004@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-valfsuite@gmail.com,viliorlandi@gmail.com,angrimaldi@gmail.com,valf2004@gmail.com}
      DATABASE_URL: postgresql://valfsuite:${POSTGRES_PASSWORD}@postgres:5432/valfsuite

volumes:
  postgres_data:
